# bettercms-managed rung=prod api=https://api.bettercms.ai project=hkYTSJwKY0CCsVtPI44z0 — written by BetterCMS; do not edit
# Wires this repository's own <form> elements to the CMS forms BetterCMS derived from its site.
# Dispatched by BetterCMS after a release. Runs NO command from this repository — only the
# published @bettercms-ai/convert codemod, and a lockfile-only npm or pnpm resolve with scripts
# off when that adds the SDK — which is why it may commit while bcms-rebuild.yml, which runs your
# install and build commands, may not.
name: BetterCMS Convert

on:
  repository_dispatch:
    types: [bcms-convert-prod]

permissions:
  contents: write

jobs:
  convert:
    if: github.event.client_payload.projectId == 'hkYTSJwKY0CCsVtPI44z0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      API_URL: https://api.bettercms.ai
      PROJECT_ID: hkYTSJwKY0CCsVtPI44z0
      TARGET_SHA: ${{ github.event.client_payload.targetCommitSha }}
      TARGET_BRANCH: ${{ github.event.client_payload.branch }}
      KINDS: ${{ github.event.client_payload.kinds || 'forms' }}
      # A setup plan's send stamp, handed back with its receipt and its failure: what the platform
      # matches them to, so a late report from an earlier send counts for nothing.
      BCMS_DISPATCH: ${{ github.event.client_payload.dispatched }}
      ROOT_DIR: ${{ vars.BCMS_ROOT_DIR }}

    steps:
      # The token rides in the dispatch payload, not in a repository secret, so nothing masks it
      # for us — and Actions echoes every step's env into the log. It was printed in clear on
      # the first live run. Mask it before any step names it, and name it only in the two steps
      # that use it (a job-level env would be echoed by THIS step, before the mask).
      - name: Mask the callback token
        run: echo "::add-mask::$(jq -r .client_payload.callbackToken "$GITHUB_EVENT_PATH")"

      # A setup plan's run says it started, so the platform waits out the job instead of sending a
      # run that is still working again 30 minutes in.
      - name: Say the run started
        if: contains(env.KINDS, 'plan')
        continue-on-error: true
        env:
          CALLBACK_TOKEN: ${{ github.event.client_payload.callbackToken }}
        run: |
          node -e 'fetch(process.env.API_URL + "/api/v1/management/projects/current/convert-run", { method: "POST", headers: { Authorization: "Bearer " + process.env.CALLBACK_TOKEN, "Content-Type": "application/json" }, body: JSON.stringify({ dispatched: process.env.BCMS_DISPATCH, status: "running" }) }).then(async (res) => console.log(res.status + " " + (await res.text()).slice(0, 300)))'

      - name: Checkout the release's commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.targetCommitSha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.BCMS_NODE_VERSION || '22' }}

      # The editor's spacing and style handles: every section root and field element the release
      # measured with no data-bcms-style gets the marker. Adopt-only and idempotent; first, so if a
      # class or style token changed, the whole upgrade is dropped and nothing else is lost with it.
      - name: Turn on the editor's style handles
        if: contains(env.KINDS, 'upgrade')
        run: |
          npx -y "@bettercms-ai/convert@>=0.49.0 <0.51.0" --upgrade-sections --root "${ROOT_DIR:-.}" || echo "upgrade-sections: not applied, see above"
          npx -y "@bettercms-ai/convert@>=0.49.0 <0.51.0" --upgrade-element-styles --root "${ROOT_DIR:-.}" || echo "upgrade-element-styles: not applied, see above"
          if ! npx -y "@bettercms-ai/convert@>=0.49.0 <0.51.0" --verify-styles --root "${ROOT_DIR:-.}"; then
            echo "upgrade: a class or style token changed, so none of it is kept"
            git checkout -- . && git clean -fdq
          fi

      # The COMPLETE brief, every page: the codemod's receipt carries a digest over the whole path
      # list, and a partial brief would compute one the platform never issued.
      - name: Read the conversion brief
        env:
          CALLBACK_TOKEN: ${{ github.event.client_payload.callbackToken }}
        run: |
          node - <<'BCMS_BRIEF'
          const fs = require("node:fs");
          const base = process.env.API_URL + "/api/v1/management/projects/current/conversion-brief";
          const headers = { Authorization: "Bearer " + process.env.CALLBACK_TOKEN };
          (async () => {
            let brief = null;
            let cursor = "";
            for (;;) {
              const url = cursor ? base + "?cursor=" + encodeURIComponent(cursor) : base + "?complete=true";
              const res = await fetch(url, { headers });
              if (!res.ok) throw new Error("brief " + res.status + ": " + (await res.text()).slice(0, 300));
              const { data } = await res.json();
              if (!brief) brief = { ...data, pages: [] };
              brief.pages.push(...(data.pages || []));
              if (!data.cursor) break;
              cursor = data.cursor;
            }
            delete brief.cursor; delete brief.page; delete brief.pageCount;
            fs.writeFileSync(process.env.RUNNER_TEMP + "/brief.json", JSON.stringify(brief));
            console.log("brief: " + brief.pages.length + " page(s), " + (brief.forms || []).length + " form(s), " + brief.briefDigest);
          })().catch((err) => { console.error(err); process.exit(1); });
          BCMS_BRIEF

      # D15: the setup plan's fields, bound in this repository's own templates by the codemod.
      - name: Bind the setup plan
        if: contains(env.KINDS, 'plan')
        run: |
          npx -y "@bettercms-ai/convert@>=0.49.0 <0.51.0" --brief "$RUNNER_TEMP/brief.json" --root "${ROOT_DIR:-.}" --receipt "$RUNNER_TEMP/receipt.json"

      - name: Wire the forms
        if: contains(env.KINDS, 'forms')
        run: |
          npx -y "@bettercms-ai/convert@>=0.49.0 <0.51.0" --forms --brief "$RUNNER_TEMP/brief.json" --root "${ROOT_DIR:-.}" --receipt "$RUNNER_TEMP/receipt.json"

      # The plan the platform holds for this project's sections: which bands each page places, and
      # which component renders each. The unflagged read is the codemod's plan.json, verbatim.
      - name: Read the sections plan
        if: contains(env.KINDS, 'sections')
        env:
          CALLBACK_TOKEN: ${{ github.event.client_payload.callbackToken }}
        run: |
          node - <<'BCMS_PLAN'
          const fs = require("node:fs");
          const url = process.env.API_URL + "/api/v1/management/projects/current/componentize-plan";
          fetch(url, { headers: { Authorization: "Bearer " + process.env.CALLBACK_TOKEN } }).then(async (res) => {
            if (!res.ok) throw new Error("plan " + res.status + ": " + (await res.text()).slice(0, 300));
            const { data } = await res.json();
            fs.writeFileSync(process.env.RUNNER_TEMP + "/plan.json", JSON.stringify(data));
            console.log("plan: " + (data.pages || []).length + " page(s), digest " + data.digest);
          }).catch((err) => { console.error(err); process.exit(1); });
          BCMS_PLAN

      # Each page's hardcoded bands become one <Sections page="…" />: the page's CMS block list, in
      # the CMS order, each section root stamped. What it cannot do, it leaves and lists by reason.
      - name: Let BetterCMS control section order
        if: contains(env.KINDS, 'sections')
        run: |
          npx -y "@bettercms-ai/convert@>=0.49.0 <0.51.0" --componentize --brief "$RUNNER_TEMP/brief.json" --plan "$RUNNER_TEMP/plan.json" --root "${ROOT_DIR:-.}" --receipt "$RUNNER_TEMP/sections.json"

      # The pages --componentize could not lift keep their sections hard-coded. --sections wraps
      # them where they stand in <BcmsSections>, so this build still renders the CMS order; the page
      # list says which binds the CMS already places. --add-sdk: a repository without the SDK, or
      # with one older than <BcmsSections>, gets its package.json range raised instead of every page
      # refused SDK_REQUIRED, and its npm or pnpm lockfile resolved again to match (registry only:
      # no scripts, no pnpmfile). A yarn or bun lockfile cannot be refreshed without running the
      # repository's own tooling, so those keep the SDK_REQUIRED refusal rather than a lockfile left
      # behind. Both steps may come back empty-handed (an API or a codemod from before this step),
      # and neither may fail the run the section order above already made.
      - name: Read the page list
        if: contains(env.KINDS, 'sections')
        continue-on-error: true
        env:
          CALLBACK_TOKEN: ${{ github.event.client_payload.callbackToken }}
        run: |
          node - <<'BCMS_PAGES'
          const fs = require("node:fs");
          const url = process.env.API_URL + "/api/v1/management/projects/current/sections-receipt";
          fetch(url, { headers: { Authorization: "Bearer " + process.env.CALLBACK_TOKEN } }).then(async (res) => {
            if (!res.ok) throw new Error("pages " + res.status + ": " + (await res.text()).slice(0, 300));
            const { data } = await res.json();
            fs.writeFileSync(process.env.RUNNER_TEMP + "/pages.json", JSON.stringify({ pages: data.pages || [] }));
            console.log("pages: " + (data.pages || []).length);
          }).catch((err) => { console.error(err); process.exit(1); });
          BCMS_PAGES

      - name: Render sections from BetterCMS
        if: contains(env.KINDS, 'sections')
        run: |
          LOCK=""
          LOCK_DIR=""
          for d in "${ROOT_DIR:-.}" .; do
            for f in package-lock.json pnpm-lock.yaml yarn.lock bun.lock bun.lockb; do
              if [ -z "$LOCK" ] && [ -f "$d/$f" ]; then LOCK="$f"; LOCK_DIR="$d"; fi
            done
          done
          case "$LOCK" in
            yarn.lock|bun.lock|bun.lockb) ADD_SDK="" ;;
            *) ADD_SDK="--add-sdk" ;;
          esac
          if [ -f "$RUNNER_TEMP/pages.json" ]; then
            npx -y "@bettercms-ai/convert@>=0.49.0 <0.51.0" --sections $ADD_SDK --pages "$RUNNER_TEMP/pages.json" --root "${ROOT_DIR:-.}" --receipt "$RUNNER_TEMP/wrap.json" || echo "sections: not applied, see above"
          fi
          if [ -n "$ADD_SDK" ] && [ -n "$LOCK" ] && ! git diff --quiet -- "${ROOT_DIR:-.}/package.json"; then
            case "$LOCK" in
              package-lock.json) (cd "$LOCK_DIR" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund) ;;
              pnpm-lock.yaml) (cd "$LOCK_DIR" && corepack pnpm install --lockfile-only --ignore-scripts --ignore-pnpmfile) ;;
            esac || echo "sections: $LOCK not refreshed, see above (the build's install refreshes it)"
          fi

      # The site keeps its media on the CDN (the default policy): every image, video, PDF or animation
      # this repository ships AND its code names literally goes to the media library, and the code
      # points at the CDN. A URL on another host (a YouTube embed, an external .mp4, a Rive runtime
      # script) is never downloaded. Kept, and listed: files the code imports and front matter names.
      # Our published CLI only, like the codemod; the commit below carries the change.
      - name: Move the site's media to the CDN
        if: contains(env.KINDS, 'media')
        env:
          BETTERCMS_API_KEY: ${{ github.event.client_payload.callbackToken }}
        run: |
          npx -y "@bettercms-ai/cli@>=0.23.0 <0.24.0" media cdn --project-id "$PROJECT_ID" --api "$API_URL" --dir "${ROOT_DIR:-.}" --no-commit --json || echo "media: not moved, see above"

      # A commit only when a file changed, as the Actions bot, [skip ci] for the repository's own
      # CI. A GITHUB_TOKEN push starts no workflow of ours either — the receipt step asks for the
      # rebuild instead.
      - name: Commit what changed
        id: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            case "$KINDS" in
              *sections*) git commit -m "chore(bettercms): let BetterCMS control section order [skip ci]" ;;
              *plan*) git commit -m "chore(bettercms): bind the setup plan's fields [skip ci]" ;;
              *forms*) git commit -m "chore(bettercms): wire forms to the CMS [skip ci]" ;;
              *upgrade*) git commit -m "chore(bettercms): turn on the editor's style handles [skip ci]" ;;
              *media*) git commit -m "chore(bettercms): serve the site's media from the BetterCMS CDN [skip ci]" ;;
              *) git commit -m "chore(bettercms): wire forms to the CMS [skip ci]" ;;
            esac
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
            echo "pushed=1" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "files=$(git show --name-only --format= HEAD | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
            echo "changed=$(git show --name-only --format= HEAD | head -20 | paste -sd ',' -)" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=0" >> "$GITHUB_OUTPUT"
          fi

      # The codemod's own account, so the dashboard can say which form is wired and which file
      # each ambiguous one could be in. `rebuild=1` only when something was pushed. Gzipped: a
      # 600-route site's receipt is 9 MB and well under the cap compressed. Its status and refusal
      # code go to "Report the run", which can name a refusal the route never saw (a 401).
      - name: Hand back the receipt
        if: contains(env.KINDS, 'forms') || contains(env.KINDS, 'plan')
        id: receipt
        env:
          CALLBACK_TOKEN: ${{ github.event.client_payload.callbackToken }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
        run: |
          node - <<'BCMS_RECEIPT'
          const fs = require("node:fs");
          const zlib = require("node:zlib");
          const said = (status, code) => fs.appendFileSync(process.env.GITHUB_OUTPUT, "status=" + status + "\ncode=" + String(code || "").replace(/[^\w-]/g, "").slice(0, 64) + "\n");
          const receipt = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/receipt.json", "utf8"));
          const url = process.env.API_URL + "/api/v1/management/projects/current/conversion-receipt" + (process.env.PUSHED === "1" ? "?rebuild=1" : "");
          fetch(url, {
            method: "POST",
            headers: { Authorization: "Bearer " + process.env.CALLBACK_TOKEN, "Content-Type": "application/json", "Content-Encoding": "gzip", "X-Bcms-Dispatch": process.env.BCMS_DISPATCH || "" },
            body: zlib.gzipSync(JSON.stringify({ briefDigest: receipt.briefDigest, receipt })),
          }).then(async (res) => {
            const text = await res.text();
            let code = "";
            try { code = JSON.parse(text).code || ""; } catch {}
            said(res.status, code);
            if (!res.ok) throw new Error("receipt " + res.status + ": " + text.slice(0, 300));
            console.log(text);
          }).catch((err) => { console.error(err); process.exit(1); });
          BCMS_RECEIPT

      # A setup plan's run says how it ended, with its page, the commit it pushed and the files that
      # commit changed: the plan shows them beside the live build. One that failed is sent again at once
      # instead of waiting out the report window, and its page is shown if it fails every time.
      - name: Report the run
        if: always() && contains(env.KINDS, 'plan')
        env:
          CALLBACK_TOKEN: ${{ github.event.client_payload.callbackToken }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          FILES: ${{ steps.commit.outputs.files }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          RECEIPT_STATUS: ${{ steps.receipt.outputs.status }}
          RECEIPT_CODE: ${{ steps.receipt.outputs.code }}
        run: |
          node -e 'fetch(process.env.API_URL + "/api/v1/management/projects/current/convert-run", { method: "POST", headers: { Authorization: "Bearer " + process.env.CALLBACK_TOKEN, "Content-Type": "application/json" }, body: JSON.stringify({ runUrl: process.env.RUN_URL, dispatched: process.env.BCMS_DISPATCH, status: process.env.STATUS, commit: process.env.COMMIT || null, files: process.env.FILES ? Number(process.env.FILES) : null, changed: (process.env.CHANGED || "").split(",").filter(Boolean), receipt: process.env.RECEIPT_STATUS ? { status: Number(process.env.RECEIPT_STATUS), code: process.env.RECEIPT_CODE || null } : null }) }).then(async (res) => console.log(res.status + " " + (await res.text()).slice(0, 300)))'

      # Each extracted section becomes its component's recorded source, so Output can build it.
      # Best-effort: the order already ships from the commit above, whatever this answers.
      - name: Record the extracted sections
        if: contains(env.KINDS, 'sections') && steps.commit.outputs.pushed == '1'
        continue-on-error: true
        env:
          CALLBACK_TOKEN: ${{ github.event.client_payload.callbackToken }}
        run: |
          node - <<'BCMS_SECTIONS'
          const fs = require("node:fs");
          const receipt = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/sections.json", "utf8"));
          fetch(process.env.API_URL + "/api/v1/management/components/preview-sources/componentize-receipt", {
            method: "POST",
            headers: { Authorization: "Bearer " + process.env.CALLBACK_TOKEN, "Content-Type": "application/json" },
            body: JSON.stringify({ receipt: { componentFiles: receipt.componentFiles || [] } }),
          }).then(async (res) => console.log(res.status + " " + (await res.text()).slice(0, 300)));
          BCMS_SECTIONS

      # Which routes the build now draws from the block list, and which were refused and why: the
      # setup gate reads it. Best-effort, like the step above.
      - name: Record the wrapped sections
        if: contains(env.KINDS, 'sections')
        continue-on-error: true
        env:
          CALLBACK_TOKEN: ${{ github.event.client_payload.callbackToken }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
        run: |
          [ -f "$RUNNER_TEMP/wrap.json" ] || exit 0
          COMMIT="$(git rev-parse HEAD)" node - <<'BCMS_WRAP'
          const fs = require("node:fs");
          const receipt = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/wrap.json", "utf8"));
          fetch(process.env.API_URL + "/api/v1/management/projects/current/sections-receipt", {
            method: "POST",
            headers: { Authorization: "Bearer " + process.env.CALLBACK_TOKEN, "Content-Type": "application/json" },
            body: JSON.stringify({ receipt, commit: process.env.PUSHED === "1" ? process.env.COMMIT : null }),
          }).then(async (res) => console.log(res.status + " " + (await res.text()).slice(0, 300)));
          BCMS_WRAP
